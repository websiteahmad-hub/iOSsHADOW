name: Build iOS SHADOW dylib

on: [push]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Compile Objective-C++ to dylib
        run: |
          echo "Compiling main.mm into libShadowMenu.dylib..."
          clang++ -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -framework UIKit -framework WebKit main.mm -o libShadowMenu.dylib

      - name: Save dylib Artifact
        uses: actions/upload-artifact@v3
        with:
          name: iOS-Shadow-Dylib
          path: libShadowMenu.dylib
